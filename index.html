<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The OPENS Journey — Find Your Next Destination</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="header">
    <div class="logo">✈️ The OPENS Journey</div>
    <ul class="nav-links">
      <li><a href="#destinations">Destinations</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Explore The Unexplored</h1>
    <p>Handcrafted journeys, breathtaking landscapes, and unforgettable tour experiences.</p>
  </section>

  <!-- Main Content Container -->
  <main class="main-container" id="destinations">
    
    <!-- Search and Filter Controls -->
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search destination, country or city...">
      <select id="categoryFilter">
        <option value="all">All Categories</option>
        <option value="Hill Station">Hill Station</option>
        <option value="Adventure">Adventure</option>
        <option value="Relaxation">Relaxation</option>
      </select>
    </div>

    <!-- Tour Cards Grid -->
    <div id="destinationsGrid" class="destinations-grid"></div>
  </main>

  <!-- Destination Detail Modal -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <div class="modal-header">
        <h3 id="mTitle">Destination Details</h3>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <div class="modal-body">
        <img id="mImg" class="modal-img" src="" alt="Destination Image">
        <p id="mLoc" class="card-location"></p>
        <p id="mDesc"></p>
        
        <div style="margin-top: 1rem; font-weight: bold; font-size: 1.2rem;" id="mPrice"></div>

        <hr style="margin: 1.5rem 0; border: none; border-top: 1px solid var(--border-color);">

        <h4>Traveller reviews</h4>
        <div id="mReviews" class="reviews"></div>

        <!-- Add Review Form -->
        <form id="reviewForm" class="review-form">
          <h4>Leave a review</h4>
          <input type="text" id="reviewerName" name="name" placeholder="Your name" required maxlength="40">
          <select id="reviewerRating" required>
            <option value="5">⭐⭐⭐⭐⭐ (5/5)</option>
            <option value="4">⭐⭐⭐⭐ (4/5)</option>
            <option value="3">⭐⭐⭐ (3/5)</option>
            <option value="2">⭐⭐ (2/5)</option>
            <option value="1">⭐ (1/5)</option>
          </select>
          <textarea id="reviewerComment" name="comment" placeholder="Share your experience..." required rows="3"></textarea>
          <button class="btn btn-sm" type="submit">Post review</button>
          <small class="muted" id="reviewNote"></small>
        </form>
      </div>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 The OPENS Journey. All rights reserved.</p>
  </footer>

  <!-- Scripts -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
